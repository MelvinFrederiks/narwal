# Narwal: web UI + backend, and the mergeability worker.
#
# `docker compose up` brings both up. Open http://localhost:7070/.
#
# The two services share nothing but the ./runs volume, which holds the SQLite
# job queue and each job's hashcat artifacts. The API enqueues and reads; the
# worker claims and writes. That is the only channel between them, which is
# what lets the worker move to a GPU box later by changing a mount.
#
# The worker runs CPU-only here (hashcat on a PoCL OpenCL device) so the stack
# works end-to-end on any machine. For GPU:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up

services:
  narwal:
    build:
      context: .
      dockerfile: Dockerfile
    image: narwal:dev
    container_name: narwal
    ports:
      - "7070:7070"
    volumes:
      - ./backend:/app/backend
      - ./web:/app/web
      # Optional read-only "server wordlists" library — see .env.example.
      # NARWAL_WORDLISTS_DIR (host path, set in .env) is mounted at the fixed
      # container path /mnt/wordlists, which the `environment:` block below
      # then points the app at. Falls back to ./data (present, empty on a
      # fresh clone) when unset, so the feature is a no-op rather than a
      # broken mount.
      - ${NARWAL_WORDLISTS_DIR:-./data}:/mnt/wordlists:ro
      # Job queue + results. Read-write, and shared with the worker.
      # NARWAL_RUNS_HOST_DIR only exists so the e2e scripts under scripts/ can
      # point at a throwaway directory; leave it unset in normal use.
      - ${NARWAL_RUNS_HOST_DIR:-./runs}:/runs
    environment:
      - NARWAL_WORDLISTS_DIR=/mnt/wordlists
      - NARWAL_WORDLISTS_REGEX=${NARWAL_WORDLISTS_REGEX:-}
      - NARWAL_RUNS_DIR=/runs
    restart: unless-stopped

  narwal-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: narwal-worker:dev
    container_name: narwal-worker
    volumes:
      - ./backend:/app/backend
      - ./worker:/app/worker
      # Must resolve to the same files, at the same container path, as the API
      # sees — a job stores wordlist paths relative to this directory.
      - ${NARWAL_WORDLISTS_DIR:-./data}:/mnt/wordlists:ro
      - ${NARWAL_RUNS_HOST_DIR:-./runs}:/runs
    environment:
      - NARWAL_WORDLISTS_DIR=/mnt/wordlists
      - NARWAL_WORDLISTS_REGEX=${NARWAL_WORDLISTS_REGEX:-}
      - NARWAL_RUNS_DIR=/runs
      # hashcat refuses to run on an OpenCL device it considers outdated, which
      # is exactly what the PoCL CPU runtime is. --force is how you say "yes,
      # I know this is a CPU". Turn it off (NARWAL_HASHCAT_FORCE=) when running
      # against a real GPU, where the warning would be worth heeding.
      - NARWAL_HASHCAT_FORCE=${NARWAL_HASHCAT_FORCE:-1}
      - NARWAL_HASHCAT_EXTRA=${NARWAL_HASHCAT_EXTRA:-}
      # Seconds without a heartbeat before a job is assumed abandoned and
      # requeued. Must stay comfortably above the ~1s heartbeat interval.
      - NARWAL_WORKER_STALE=${NARWAL_WORKER_STALE:-120}
      - NARWAL_WORKER_POLL=${NARWAL_WORKER_POLL:-2}
    restart: unless-stopped
    depends_on:
      - narwal
