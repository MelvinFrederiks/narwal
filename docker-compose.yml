# Standalone Narwal container.
#
# `docker compose up` brings up the Narwal web UI + backend on port 7070.
# Open http://localhost:7070/.

services:
  narwal:
    build:
      context: .
      dockerfile: Dockerfile
    image: narwal:dev
    container_name: narwal
    ports:
      - "7070:7070"
    volumes:
      - ./backend:/app/backend
      - ./web:/app/web
    restart: unless-stopped
