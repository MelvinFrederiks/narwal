# Reference password corpora.
#
# Source of truth: MAYA / Corrias et al. 2026 (arxiv:2504.16651) Table 2,
# plus HIBP top10M which we use for guess-list attacks (not in MAYA scope).
#
# All entries are cleaned through demeuk at container build time and cached
# under data/clean/<id>.txt.gz. See wiki/methodology.md "Reference corpora".

[rockyou]
path = "raw/rockyou.txt"
size = 32603604
unique = 14311994
year = 2009
origin = "USA"
language = "en"
service = "gaming"
policy = "none"
min_length = 5
notes = "Canonical baseline. Most permissive policy among MAYA's datasets."

