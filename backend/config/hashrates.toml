# Per-card hashcat throughput, in GH/s, for the supported hash types.
# Source: hashcat published benchmarks for RTX 5080.
# Numbers below match wiki/methodology.md "Cluster speed defaults".
#
# All cluster-wide hashrates derive from `per_card_ghs * gpu_count`.
# No throughput numbers live anywhere else in the codebase.

default_gpu = "rtx_5080"
default_gpu_count = 8

[ntlm]
hashcat_mode = 1000
per_card_ghs = 105.0
notes = "Fast, no salting."

[md5]
hashcat_mode = 0
per_card_ghs = 95.0
notes = "Fast, no salting."

[bcrypt]
hashcat_mode = 3200
per_card_ghs = 0.011  # 11 MH/s = 0.011 GH/s
notes = "bcrypt $2b$05. Cost factor dominates throughput."

[sha1]
hashcat_mode = 100
per_card_ghs = 50.0
notes = "Estimate from public benchmarks; user override recommended."

[sha256]
hashcat_mode = 1400
per_card_ghs = 22.0
notes = "Estimate from public benchmarks; user override recommended."
