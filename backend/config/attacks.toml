# Attack library. Each entry is a candidate attack the composer can include
# in a pipeline. Rules reference files shipped with hashcat in
# /usr/share/hashcat/rules/ (best64.rule, d3ad0ne.rule, dive.rule, etc.).
# See wiki/extending.md "Adding an attack".

[[attack]]
id = "rockyou_best64"
type = "wordlist+rules"
wordlist = "rockyou"
rules = "best64.rule"
label = "rockyou + best64"
notes = "Standard cheap baseline. ~14M words × 77 rules ≈ 1.1B candidates."

[[attack]]
id = "rockyou_d3ad0ne"
type = "wordlist+rules"
wordlist = "rockyou"
rules = "d3ad0ne.rule"
label = "rockyou + d3ad0ne"
notes = "High-recall ruleset. ~34k rules — substantially bigger keyspace than best64."

[[attack]]
id = "rockyou_dive"
type = "wordlist+rules"
wordlist = "rockyou"
rules = "dive.rule"
label = "rockyou + dive"
notes = "Aggressive ~99k-rule set. Replaces 'comb + dive' from the storyboard."

[[attack]]
id = "hibp_best64"
type = "wordlist+rules"
wordlist = "hibp_top10m"
rules = "best64.rule"
label = "hibp + best64"
notes = "HIBP wordlist + small ruleset. Storyboard's 'hibp + unicorn' analog (unicorn not in stock hashcat)."

[[attack]]
id = "hibp_straight"
type = "wordlist"
wordlist = "hibp_top10m"
label = "HIBP top10M straight"
notes = "Pure guess-list. Cheapest credential-stuffing pass."

[[attack]]
id = "mask_l6"
type = "mask"
mask = "?l?l?l?l?l?l"
label = "?l×6"
notes = "Length-6 lowercase. Cheap and high-yield on permissive corpora."

[[attack]]
id = "mask_l8_d2"
type = "mask"
mask = "?l?l?l?l?l?l?l?l?d?d"
label = "?l×8 ?d×2"
notes = "From Van Heijningen Table O.1 row 25 — 67.19% cumulative."

[[attack]]
id = "mask_d6"
type = "mask"
mask = "?d?d?d?d?d?d"
label = "?d×6 (date / PIN)"
notes = "Single most common mask across MAYA's datasets except 000webhost."

[[attack]]
id = "mask_u_l4_d2"
type = "mask"
mask = "?u?l?l?l?l?d?d"
label = "?u?l×4?d×2 (Capitalized99)"
notes = "Captures the Capitalized + 2-digit suffix pattern enforced by some policies."

[[attack]]
id = "omen_rockyou_5e8"
type = "omen"
training = "rockyou"
guess_budget = 500000000
label = "OMEN rockyou-trained, 5×10⁸ guesses"
notes = "Async; computes guess-number curve. Not in v1 slice — stub only."

[[attack]]
id = "fla_rockyou_1e7"
type = "fla"
training = "rockyou"
guess_budget = 10000000
label = "FLA rockyou-trained, 10⁷ guesses"
notes = "Melicher 2016 LSTM via MAYA subprocess. Requires `fla_runner.train('rockyou')` first — no checkpoint shipped; training is multi-hour on CPU."
