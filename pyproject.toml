[project]
name = "narwal"
version = "0.1.0"
description = "Browser-side password corpus visualizer: keyspace coverage and analysis-result histograms."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: drives a real hashcat binary; skipped unless one is runnable (NARWAL_HASHCAT_BIN, or hashcat on PATH)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
