<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>narwal-logo.svg — viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(ellipse 60% 80% at 30% 20%, rgba(74,159,204,0.18), transparent 60%),
        radial-gradient(ellipse 70% 70% at 80% 80%, rgba(135,229,122,0.10), transparent 60%),
        linear-gradient(160deg, #0c1620 0%, #14202e 60%, #0a141d 100%);
      color: #e8e6dd;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header {
      padding: 16px 28px; border-bottom: 0.5px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 12px;
    }
    header h1 {
      margin: 0; font-size: 14px; font-weight: 500;
      color: #b4b2a9; letter-spacing: 0.3px;
    }
    header .meta {
      margin-left: auto; font-size: 12px; color: #888780;
      font-family: "SF Mono", Menlo, monospace;
    }
    main {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 24px; padding: 32px;
      align-content: center; max-width: 1200px; margin: 0 auto;
    }
    .stage {
      display: flex; flex-direction: column; align-items: center;
      gap: 16px;
    }
    .stage .circle {
      width: 280px; height: 280px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      box-shadow:
        0 24px 60px rgba(0,0,0,0.45),
        inset 0 -20px 40px rgba(0,0,0,0.20),
        inset 0 20px 30px rgba(255,255,255,0.04);
    }
    .stage .circle.steel {
      background: radial-gradient(circle at 35% 30%, #2a3a4a, #0f1a24 70%);
      border: 1px solid rgba(135,198,240,0.18);
    }
    .stage .circle.violet {
      background: radial-gradient(circle at 35% 30%, #3a2a4a, #1d1024 70%);
      border: 1px solid rgba(183,108,224,0.20);
    }
    .stage .circle.deep {
      background: #000000;
      border: 1px solid rgba(255,255,255,0.10);
    }
    .stage object {
      width: 78%; height: 78%;
      pointer-events: auto;
    }
    .stage .caption {
      color: #b4b2a9; font-size: 12px;
      font-family: "SF Mono", Menlo, monospace;
    }
    .legend {
      max-width: 720px; margin: 0 auto; padding: 18px 28px;
      border-top: 0.5px solid rgba(255,255,255,0.08);
      color: #888780; font-size: 12px;
      display: flex; gap: 28px; flex-wrap: wrap; justify-content: center;
    }
    .legend strong { color: #e8e6dd; font-weight: 500; }
    .legend code {
      background: rgba(255,255,255,0.06); padding: 1px 6px; border-radius: 4px;
      color: #b4b2a9;
    }
  </style>
</head>
<body>
  <header>
    <h1>narwal-logo.svg</h1>
    <span class="meta">/web/assets/narwal-logo.svg · standalone · transparent bg</span>
  </header>

  <main>
    <div class="stage">
      <div class="circle steel">
        <object type="image/svg+xml" data="../../web/assets/narwal-logo.svg"></object>
      </div>
      <div class="caption">steel</div>
    </div>
    <div class="stage">
      <div class="circle deep">
        <object type="image/svg+xml" data="../../web/assets/narwal-logo.svg"></object>
      </div>
      <div class="caption">deep</div>
    </div>
    <div class="stage">
      <div class="circle violet">
        <object type="image/svg+xml" data="../../web/assets/narwal-logo.svg"></object>
      </div>
      <div class="caption">violet</div>
    </div>
  </main>

  <div class="legend">
    <span><strong>hair</strong> · CSS sway</span>
    <span><strong>stars</strong> · CSS twinkle ×7</span>
    <span><strong>eyes</strong> · <code>JS</code> random blink (occasional double)</span>
    <span><strong>tail</strong> · CSS wag</span>
    <span><strong>prefers-reduced-motion</strong> · honored</span>
  </div>
</body>
</html>
