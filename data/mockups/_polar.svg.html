<!-- Embeddable SVG fragments. Read by the mockup HTML files and dropped
     into the document via fetch+innerHTML in production; for the mockups
     we just copy/paste so the screenshot tool stays standalone. -->

<!-- Happy bear, ~64px -->
<template id="bear-happy">
  <svg class="bear" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="62" rx="38" ry="22" fill="#fafdff" stroke="#7a8a96" stroke-width="0.8"/>
    <circle  cx="50" cy="36" r="22"           fill="#fafdff" stroke="#7a8a96" stroke-width="0.8"/>
    <circle  cx="33" cy="22" r="7"            fill="#fafdff" stroke="#7a8a96" stroke-width="0.8"/>
    <circle  cx="67" cy="22" r="7"            fill="#fafdff" stroke="#7a8a96" stroke-width="0.8"/>
    <circle  cx="33" cy="22" r="3.6"          fill="#e6c4b0"/>
    <circle  cx="67" cy="22" r="3.6"          fill="#e6c4b0"/>
    <ellipse cx="50" cy="44" rx="11" ry="7"   fill="#ffffff" stroke="#9caab6" stroke-width="0.6"/>
    <ellipse cx="50" cy="40" rx="3.4" ry="2.4" fill="#1b1b18"/>
    <circle  cx="41" cy="33" r="2.3"          fill="#1b1b18"/>
    <circle  cx="59" cy="33" r="2.3"          fill="#1b1b18"/>
    <circle  cx="41.7" cy="32.3" r="0.7"      fill="#ffffff"/>
    <circle  cx="59.7" cy="32.3" r="0.7"      fill="#ffffff"/>
    <path    d="M44 46 Q50 51 56 46" stroke="#1b1b18" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- cheek blush -->
    <ellipse cx="36" cy="40" rx="3" ry="1.6" fill="#ffd1c1" opacity="0.7"/>
    <ellipse cx="64" cy="40" rx="3" ry="1.6" fill="#ffd1c1" opacity="0.7"/>
  </svg>
</template>

<!-- Iceberg sliver under the bear -->
<template id="iceberg">
  <svg class="ice" viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="ig" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#dff0fb"/>
        <stop offset="1" stop-color="#7fb6dc"/>
      </linearGradient>
      <linearGradient id="igDeep" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#467899" stop-opacity="0.85"/>
        <stop offset="1" stop-color="#234a64" stop-opacity="0.85"/>
      </linearGradient>
    </defs>
    <path d="M10 40 L40 28 L100 24 L150 30 L190 40 L170 56 L120 60 L70 58 L20 52 Z"
          fill="url(#ig)" stroke="#7a8a96" stroke-width="0.6"/>
    <path d="M20 52 L70 58 L120 60 L170 56 L160 78 L100 84 L40 78 Z"
          fill="url(#igDeep)" stroke="#345d77" stroke-width="0.4"/>
    <!-- ripple under -->
    <path d="M0 88 Q40 84 80 88 T160 88 T200 88" stroke="#a4cae2" stroke-width="1.2" fill="none"/>
  </svg>
</template>
