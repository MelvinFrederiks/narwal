<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated Narwhal Logo</title>
<style>
  :root {
    --mx: 0px;
    --my: 0px;
    --tilt: 0deg;
    --pupilLX: 0px;
    --pupilLY: 0px;
    --pupilRX: 0px;
    --pupilRY: 0px;
    --pupilRotL: 0deg;
    --pupilRotR: 0deg;
    --eyeRotL: 0deg;
    --eyeRotR: 0deg;
    /* Use 'light' so the UA paints a transparent/light canvas behind
       the narwhal, not the dark default that bleeds through. */
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: transparent !important;
  }

  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }

  .card {
    position: relative;
    width: min(84vmin, 760px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    user-select: none;
    background: transparent !important;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    background: transparent !important;
    /* drop-shadow removed — painted a dark halo on transparent bg. */
  }

  .narwhal {
    position: absolute;
    inset: 0;
    transform: translate(var(--mx), var(--my)) rotate(var(--tilt));
    transition: transform 140ms ease-out;
    transform-origin: 50% 58%;
    animation: bob 4.8s ease-in-out infinite;
  }

  .parts {
    position: absolute;
    inset: 0;
    animation: breathe 6.2s ease-in-out infinite;
    transform-origin: 50% 58%;
  }

  .wrap, .star-wrap, .tail-grow-wrap {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .part {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .tail-grow-wrap {
    transform-origin: 71.6% 65.4%;
    animation: tailGrow 6.4s ease-in-out infinite;
    will-change: transform;
  }

  .tail-wrap { transform-origin: 71.6% 65.4%; animation: tailWag 2.2s ease-in-out infinite; will-change: transform; }
  .left-fin-wrap { transform-origin: 20.6% 75.8%; animation: leftFinFlap 3.2s ease-in-out infinite; will-change: transform; }
  .right-fin-wrap { transform-origin: 67.2% 76.0%; animation: rightFinFlap 3.2s ease-in-out infinite; will-change: transform; }
  .horn-wrap { transform-origin: 45.4% 40.6%; animation: hornTilt 4.8s ease-in-out infinite; will-change: transform; }
  .hair-wrap { transform-origin: 49.6% 43.9%; animation: hairSway 3.7s ease-in-out infinite; will-change: transform; }
  .mouth-wrap { transform-origin: 45.6% 64.2%; animation: mouthBounce 3.0s ease-in-out infinite; will-change: transform; }
  .blush-left-wrap, .blush-right-wrap { animation: blushPulse 4.4s ease-in-out infinite; will-change: opacity, transform; }

  .eye-slot {
    position: absolute;
    pointer-events: none;
    overflow: visible;
  }

  .eye-turn {
    position: absolute;
    inset: 0;
    transform-origin: 50% 50%;
    transition: transform 70ms linear;
    will-change: transform;
  }

  .eye-turn.left { transform: rotate(var(--eyeRotL)); }
  .eye-turn.right { transform: rotate(var(--eyeRotR)); }

  .eye-blink {
    position: absolute;
    inset: 0;
    animation: blink 6s infinite;
    transform-origin: 50% 50%;
    will-change: transform;
  }

  .eye-slot.right .eye-blink { animation-delay: .12s; }

  .eye-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .pupil {
    position: absolute;
    inset: 0;
    transition: transform 70ms linear;
    will-change: transform;
  }

  .pupil.left { transform: translate(var(--pupilLX), var(--pupilLY)) rotate(var(--pupilRotL)); transform-origin: 50% 50%; }
  .pupil.right { transform: translate(var(--pupilRX), var(--pupilRY)) rotate(var(--pupilRotR)); transform-origin: 50% 50%; }

  .star-wrap {
    inset: auto;
    animation: starDance var(--sdur) ease-in-out infinite;
    animation-delay: var(--sdelay);
    transform-origin: 50% 50%;
    will-change: transform, opacity;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.36));
  }

  .star-img { width: 100%; height: 100%; }

  .debug .eye-slot { outline: 2px solid rgba(255,0,255,.75); }
  .debug .star-wrap { outline: 1px solid rgba(255,255,0,.75); }
  .debug .tail-wrap { outline: 2px solid rgba(0,255,255,.55); }

  .paused * { animation-play-state: paused !important; }

  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-0.8deg); }
    50% { transform: translateY(-14px) rotate(1deg); }
  }

  @keyframes breathe {
    0%,100% { transform: scale(1); }
    35% { transform: scale(.986); }
    68% { transform: scale(1.012); }
  }

  @keyframes tailGrow {
    0%, 44%, 100% { transform: scale(1); }
    54% { transform: scale(1.075); }
    62% { transform: scale(.985); }
    70% { transform: scale(1.035); }
    78% { transform: scale(1); }
  }

  @keyframes tailWag {
    0%,100% { transform: rotate(0deg) translate(0,0); }
    22% { transform: rotate(5.2deg) translate(1px,-1px); }
    50% { transform: rotate(.2deg) translate(0,0); }
    78% { transform: rotate(-5.6deg) translate(-1px,1px); }
  }

  /* Hover-happy: the host page toggles body.happy on mouse-enter, kicking
     the tail into a faster, wider wag (like a dog wagging), with the fins
     flapping a touch quicker for extra excitement. */
  .happy .tail-wrap { animation-name: tailWagHappy; animation-duration: .42s; }
  .happy .left-fin-wrap, .happy .right-fin-wrap { animation-duration: 1.1s; }
  @keyframes tailWagHappy {
    0%,100% { transform: rotate(-17deg) translate(-1px,1px); }
    50%     { transform: rotate(17deg) translate(1px,-1px); }
  }

  @keyframes leftFinFlap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(2.4deg) translate(0,1px); } }
  @keyframes rightFinFlap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-2.4deg) translate(0,1px); } }
  @keyframes hornTilt { 0%,100% { transform: rotate(0deg); } 44% { transform: rotate(-0.85deg); } 72% { transform: rotate(0.65deg); } }

  @keyframes hairSway {
    0%,100% { transform: rotate(0deg) translate(0,0); }
    28% { transform: rotate(-1.4deg) translate(-2px,-1px); }
    56% { transform: rotate(1.05deg) translate(2px,.5px); }
    80% { transform: rotate(-0.55deg) translate(-1px,0); }
  }

  @keyframes mouthBounce { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(.7px) scale(1.015,.992); } }

  @keyframes blink {
    0%,8%,100% { transform: scaleY(1); }
    9% { transform: scaleY(.08); }
    10.5% { transform: scaleY(1); }
    54% { transform: scaleY(1); }
    55% { transform: scaleY(.12); }
    56.5% { transform: scaleY(1); }
  }

  @keyframes blushPulse { 0%,100% { opacity: .98; transform: scale(1); } 50% { opacity: 1; transform: scale(1.02); } }

  @keyframes starDance {
    0%,100% { transform: translate(0,0) scale(1) rotate(0deg); opacity: .86; }
    18% { transform: translate(calc(var(--sx) * .45), calc(var(--sy) * .45)) scale(calc(var(--speak) * .98)) rotate(4deg); opacity: 1; }
    38% { transform: translate(var(--sx), var(--sy)) scale(.92) rotate(8deg); opacity: .90; }
    58% { transform: translate(calc(var(--sx) * .3), calc(var(--sy) * .2)) scale(var(--speak)) rotate(2deg); opacity: .98; }
    76% { transform: translate(calc(var(--sx) * -.25), calc(var(--sy) * -.15)) scale(.91) rotate(-3deg); opacity: .88; }
  }

  @media (prefers-reduced-motion: reduce) {
    .narwhal, .parts, .tail-grow-wrap, .tail-wrap, .left-fin-wrap, .right-fin-wrap,
    .horn-wrap, .hair-wrap, .mouth-wrap, .eye-blink, .blush-left-wrap, .blush-right-wrap,
    .star-wrap { animation: none !important; }
    .eye-turn, .pupil { transition: none; }
  }
</style>

<script>
(() => {
  const card = document.getElementById('card');
  const root = document.documentElement;
  const params = new URLSearchParams(location.search);
  let paused = false;

  if (params.has('debug')) {
    document.body.classList.add('debug');
  }

  const eyeCenters = {
    left: { x: 406.5, y: 723 },
    right: { x: 739, y: 723.5 }
  };

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function setLookFromCanvasPoint(x, y) {
    for (const side of ['left', 'right']) {
      const c = eyeCenters[side];
      const dx = x - c.x;
      const dy = y - c.y;
      const angle = Math.atan2(dy, dx);
      const distance = Math.min(5.0, Math.hypot(dx, dy) / 65);
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance;
      const angleDeg = angle * 180 / Math.PI;
      const pupilRot = (Math.hypot(dx, dy) < 6) ? 0 : (angleDeg + 45);
      const eyeRot = clamp(pupilRot * 0.12, -12, 12);

      root.style.setProperty(side === 'left' ? '--pupilLX' : '--pupilRX', `${tx.toFixed(2)}px`);
      root.style.setProperty(side === 'left' ? '--pupilLY' : '--pupilRY', `${ty.toFixed(2)}px`);
      root.style.setProperty(side === 'left' ? '--pupilRotL' : '--pupilRotR', `${pupilRot.toFixed(2)}deg`);
      root.style.setProperty(side === 'left' ? '--eyeRotL' : '--eyeRotR', `${eyeRot.toFixed(2)}deg`);
    }
  }

  function updateFromPointer(event) {
    const rect = card.getBoundingClientRect();
    const px = ((event.clientX - rect.left) / rect.width) - 0.5;
    const py = ((event.clientY - rect.top) / rect.height) - 0.5;

    root.style.setProperty('--mx', `${(px * 14).toFixed(2)}px`);
    root.style.setProperty('--my', `${(py * 10).toFixed(2)}px`);
    root.style.setProperty('--tilt', `${(px * 2).toFixed(2)}deg`);

    /*
      Eye-following cursor code is disabled for now.

      To re-enable it later, call:

        setLookFromCanvasPoint(
          ((event.clientX - rect.left) / rect.width) * 1254,
          ((event.clientY - rect.top) / rect.height) * 1254
        );

      The function is left in this file intentionally, so the eye behavior can be
      tuned without rebuilding the layers again.
    */
  }

  function reset() {
    root.style.setProperty('--mx', '0px');
    root.style.setProperty('--my', '0px');
    root.style.setProperty('--tilt', '0deg');
    root.style.setProperty('--pupilLX', '0px');
    root.style.setProperty('--pupilLY', '0px');
    root.style.setProperty('--pupilRX', '0px');
    root.style.setProperty('--pupilRY', '0px');
    root.style.setProperty('--pupilRotL', '0deg');
    root.style.setProperty('--pupilRotR', '0deg');
    root.style.setProperty('--eyeRotL', '0deg');
    root.style.setProperty('--eyeRotR', '0deg');
  }

  /*
    Eye test-look code disabled together with cursor following.

      const testLook = params.get('look');
      if (testLook) {
        const presets = {
          center: [627, 627],
          tl: [0, 0],
          tr: [1254, 0],
          bl: [0, 1254],
          br: [1254, 1254],
          left: [0, 627],
          right: [1254, 627],
          up: [627, 0],
          down: [627, 1254]
        };
        if (presets[testLook]) {
          setLookFromCanvasPoint(...presets[testLook]);
        } else {
          const [x, y] = testLook.split(',').map(Number);
          if (Number.isFinite(x) && Number.isFinite(y)) setLookFromCanvasPoint(x, y);
        }
      }
  */

  card.addEventListener('pointermove', updateFromPointer);
  card.addEventListener('pointerleave', reset);
  card.addEventListener('click', () => {
    paused = !paused;
    document.body.classList.toggle('paused', paused);
  });

  // When embedded in an iframe with pointer-events:none, the inner click
  // handler above never fires. The host page sends {still: true|false}
  // via postMessage; mirror that to the same paused flag.
  window.addEventListener('message', (ev) => {
    if (!ev.data) return;
    if (typeof ev.data.still === 'boolean') {
      paused = !!ev.data.still;
      document.body.classList.toggle('paused', paused);
    }
    // Host page toggles the excited tail-wag on hover.
    if (typeof ev.data.happy === 'boolean') {
      document.body.classList.toggle('happy', !!ev.data.happy);
    }
  });
})();
</script>
</body>
</html>
