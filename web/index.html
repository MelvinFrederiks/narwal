<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Narwal — password attack planner</title>
    <link rel="icon" type="image/png" sizes="16x16"  href="/assets/favicon-16.png"/>
    <link rel="icon" type="image/png" sizes="32x32"  href="/assets/favicon-32.png"/>
    <link rel="icon" type="image/png" sizes="48x48"  href="/assets/favicon-48.png"/>
    <link rel="icon" type="image/png" sizes="64x64"  href="/assets/favicon-64.png"/>
    <link rel="icon" type="image/png" sizes="128x128" href="/assets/favicon-128.png"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png"/>
    <script>
      // Apply persisted theme synchronously to avoid flash-of-light.
      // Values: "auto" (no attr, defer to prefers-color-scheme) | "light" | "dark".
      (function () {
        try {
          var t = localStorage.getItem("nrw-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root, :root[data-theme="light"] {
        --bg: #fafaf7;
        --surface: #ffffff;
        --surface-2: #f4f3ee;
        --surface-3: #ebe9e1;
        --border: rgba(0,0,0,0.12);
        --border-2: rgba(0,0,0,0.2);
        --text: #2C2C2A;
        --text-secondary: #5F5E5A;
        --text-tertiary: #888780;
        --info-bg: #E6F1FB; --info-text: #0C447C; --info-border: #185FA5;
        --success-bg: #EAF3DE; --success-text: #27500A; --success-border: #0F6E56;
        --warning-bg: #FAEEDA; --warning-text: #633806; --warning-border: #BA7517;
        --danger-bg: #FCEBEB; --danger-text: #791F1F; --danger-border: #A32D2D;
        --mask-bg: #EEEDFE; --mask-text: #26215C; --mask-border: #534AB7;
        --radius-md: 8px;
        --radius-lg: 12px;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      }
      /* Auto: follow OS preference when no explicit data-theme is set. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1a1a18;
          --surface: #25241f;
          --surface-2: #2f2e29;
          --surface-3: #383631;
          --border: rgba(255,255,255,0.12);
          --border-2: rgba(255,255,255,0.2);
          --text: #e8e6dd;
          --text-secondary: #b4b2a9;
          --text-tertiary: #888780;
          --info-bg: #042C53; --info-text: #B5D4F4; --info-border: #185FA5;
          --success-bg: #173404; --success-text: #C0DD97; --success-border: #0F6E56;
          --warning-bg: #412402; --warning-text: #FAC775; --warning-border: #BA7517;
          --danger-bg: #501313; --danger-text: #F7C1C1; --danger-border: #A32D2D;
          --mask-bg: #26215C; --mask-text: #C8C3F4; --mask-border: #534AB7;
        }
      }
      /* Explicit dark: wins over OS-pref-light. */
      :root[data-theme="dark"] {
        --bg: #1a1a18;
        --surface: #25241f;
        --surface-2: #2f2e29;
        --surface-3: #383631;
        --border: rgba(255,255,255,0.12);
        --border-2: rgba(255,255,255,0.2);
        --text: #e8e6dd;
        --text-secondary: #b4b2a9;
        --text-tertiary: #888780;
        --info-bg: #042C53; --info-text: #B5D4F4; --info-border: #185FA5;
        --success-bg: #173404; --success-text: #C0DD97; --success-border: #0F6E56;
        --warning-bg: #412402; --warning-text: #FAC775; --warning-border: #BA7517;
        --danger-bg: #501313; --danger-text: #F7C1C1; --danger-border: #A32D2D;
        --mask-bg: #26215C; --mask-text: #C8C3F4; --mask-border: #534AB7;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      /* Nav doubles as the brand bar: brand + links on the left, theme
         toggle on the right. */
      nav {
        display: flex; align-items: center; gap: 4px;
        padding: 6px 24px; min-height: 56px;
        border-bottom: 0.5px solid var(--border);
        background: var(--surface);
      }
      nav a {
        color: var(--text-secondary);
        text-decoration: none;
        padding: 6px 14px;
        border-radius: var(--radius-md);
        font-size: 13px;
        white-space: nowrap;
        transition: all 0.15s;
      }
      nav a:hover { background: var(--surface-2); color: var(--text); }
      nav a.active { background: var(--surface-3); color: var(--text); font-weight: 500; }
      nav #brand {
        font-size: 14px; font-weight: 600; letter-spacing: -0.2px;
        color: var(--text);
        padding: 6px 14px 6px 0;
        margin-right: 6px;
        border-right: 0.5px solid var(--border);
      }
      nav #nav-right {
        margin-left: auto;
        display: flex; align-items: center; gap: 14px;
      }
      nav #theme-toggle {
        display: inline-flex; align-items: center; justify-content: center;
        width: 32px; height: 32px; padding: 0;
        border-radius: 50%;
        background: transparent;
        border: 0.5px solid var(--border-2);
        color: var(--text-secondary);
        cursor: pointer;
        transition: background 0.12s ease, color 0.12s ease;
      }
      nav #theme-toggle:hover { background: var(--surface-2); color: var(--text); }
      main { padding: 24px; max-width: 1200px; margin: 0 auto; }
      .panel {
        background: var(--surface);
        border: 0.5px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: var(--shadow-sm);
      }
      .panel h2 { margin: 0 0 4px; font-size: 17px; font-weight: 500; letter-spacing: -0.2px; }
      .panel .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 14px; }
      button, select, input[type=text], input[type=number] {
        font: inherit; font-size: 13px;
        padding: 6px 12px;
        border-radius: var(--radius-md);
        border: 0.5px solid var(--border-2);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }
      input[type=text], input[type=number] { cursor: text; background: var(--surface-2); }
      button:hover, select:hover { background: var(--surface-2); }
      button:active { transform: scale(0.98); }
      button.primary {
        background: var(--warning-bg); color: var(--warning-text);
        border-color: var(--warning-border); font-weight: 500;
      }
      button.primary:hover { filter: brightness(0.98); background: var(--warning-bg); }
      .pill {
        display: inline-block; padding: 2px 10px; border-radius: 12px;
        font-size: 11px; font-weight: 500;
      }
      .pill-info { background: var(--info-bg); color: var(--info-text); }
      .pill-success { background: var(--success-bg); color: var(--success-text); }
      .pill-warning { background: var(--warning-bg); color: var(--warning-text); }
      .pill-danger { background: var(--danger-bg); color: var(--danger-text); }
      .pill-mask { background: var(--mask-bg); color: var(--mask-text); }
      .chart-wrap { position: relative; height: 460px; }
      table.kv { border-collapse: collapse; font-size: 12px; color: var(--text-secondary); }
      table.kv td { padding: 2px 12px 2px 0; }
      table.kv td:first-child { color: var(--text); }
      .loading { color: var(--text-secondary); font-style: italic; }
      .error { color: var(--danger-text); }
      .hidden { display: none !important; }
      .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      @media (max-width: 900px) {
        .grid-3, .grid-2 { grid-template-columns: 1fr; }
      }
      .card-list { display: flex; flex-direction: column; gap: 8px; }
      .card {
        background: var(--surface-2);
        border: 0.5px solid var(--border);
        border-radius: var(--radius-md);
        padding: 10px 12px;
      }
      .card.info { background: var(--info-bg); border-color: var(--info-border); color: var(--info-text); }
      .card.mask { background: var(--mask-bg); border-color: var(--mask-border); color: var(--mask-text); }
      .card.success { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
      .card.danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }
      .card.warning { background: var(--warning-bg); border-color: var(--warning-border); color: var(--warning-text); }
      .note {
        font-size: 13px; color: var(--text-secondary);
        margin-top: 12px; padding: 10px 12px;
        background: var(--surface-2); border-radius: var(--radius-md);
      }
      code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <nav id="nav">
      <span id="brand">Narwal</span>
      <div id="nav-right">
        <button id="theme-toggle"
                type="button"
                aria-label="Cycle theme: auto / light / dark"
                title="Theme — click to cycle"></button>
      </div>
    </nav>
    <main id="view"></main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
